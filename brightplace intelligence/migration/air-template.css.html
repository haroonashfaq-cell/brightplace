    <style>
        *,*::before,*::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.75;
            color: #1a1a1a;
            max-width: 780px;
            margin: 0 auto;
            padding: 48px 24px;
            background: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        article { position: relative; }

        /* Article meta bar */
        .article-meta {
            color: #6b7280;
            font-size: 0.875rem;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }

        /* Headings */
        h1 {
            font-size: 2.1rem;
            line-height: 1.2;
            margin-bottom: 24px;
            color: #0f172a;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        h2 {
            font-size: 1.5rem;
            line-height: 1.3;
            margin-top: 48px;
            margin-bottom: 16px;
            color: #0f172a;
            font-weight: 600;
        }
        h3 {
            font-size: 1.2rem;
            line-height: 1.4;
            margin-top: 32px;
            margin-bottom: 12px;
            color: #1e293b;
            font-weight: 600;
        }

        /* Body text */
        p {
            margin-bottom: 18px;
            font-size: 1.05rem;
            color: #374151;
        }

        /* Article intro — AEO citability target */
        .article-intro {
            font-size: 1.125rem;
            line-height: 1.8;
            color: #1a1a1a;
            margin-bottom: 24px;
        }

        /* Links */
        a {
            color: #2563eb;
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 2px;
            transition: color 0.15s ease;
        }
        a:hover {
            color: #1d4ed8;
        }

        /* Horizontal rules */
        hr {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 40px 0;
        }

        strong { font-weight: 600; color: #1e293b; }

        /* FAQ section */
        .faq-section {
            margin-top: 48px;
            padding-top: 32px;
            border-top: 2px solid #e5e7eb;
        }
        .faq-section h3 {
            color: #0f172a;
            margin-top: 28px;
        }
        .faq-section p {
            color: #4b5563;
        }

        /* Article footer */
        .article-footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
            color: #9ca3af;
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 640px) {
            body { padding: 24px 16px; }
            h1 { font-size: 1.75rem; }
            h2 { font-size: 1.3rem; margin-top: 36px; }
            h3 { font-size: 1.1rem; }
        }
    </style>
