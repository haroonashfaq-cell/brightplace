<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Title - must be DISTINCT from the H1 -->
    <title>{{SEO_TITLE}}</title>

    <!-- Core SEO Meta -->
    <meta name="description" content="{{META_DESCRIPTION}}">
    <meta name="keywords" content="{{FOCUS_KEYWORD}}">
    <meta name="author" content="{{AUTHOR_NAME}}">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <link rel="canonical" href="{{CANONICAL_URL}}">
    <link rel="alternate" hreflang="en-US" href="{{CANONICAL_URL}}">

    <!-- Open Graph -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="brightplace">
    <meta property="og:title" content="{{SEO_TITLE}}">
    <meta property="og:description" content="{{META_DESCRIPTION}}">
    <meta property="og:url" content="{{CANONICAL_URL}}">
    <meta property="og:image" content="{{FEATURED_IMAGE_URL}}">
    <meta property="og:locale" content="en_US">
    <meta property="article:published_time" content="{{DATE_PUBLISHED}}">
    <meta property="article:modified_time" content="{{DATE_MODIFIED}}">
    <meta property="article:author" content="{{AUTHOR_NAME}}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{SEO_TITLE}}">
    <meta name="twitter:description" content="{{META_DESCRIPTION}}">
    <meta name="twitter:image" content="{{FEATURED_IMAGE_URL}}">

    <!-- JSON-LD Structured Data - MUST be server-rendered.
         The current Webflow site injects these with JavaScript, so crawlers
         never see them. Rendering them server-side is the single biggest
         SEO win available in this migration. -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ARTICLE_TITLE}}",
  "description": "{{META_DESCRIPTION}}",
  "image": "{{FEATURED_IMAGE_URL}}",
  "author": { "@type": "Person", "name": "{{AUTHOR_NAME}}" },
  "publisher": {
    "@type": "Organization",
    "name": "brightplace",
    "url": "https://www.brightplace.ai",
    "logo": "https://www.brightplace.ai/favicon.png"
  },
  "datePublished": "{{DATE_PUBLISHED}}",
  "dateModified": "{{DATE_MODIFIED}}",
  "mainEntityOfPage": { "@type": "WebPage", "@id": "{{CANONICAL_URL}}" }
}
    </script>
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.brightplace.ai" },
    { "@type": "ListItem", "position": 2, "name": "Resources", "item": "https://www.brightplace.ai/resources" },
    { "@type": "ListItem", "position": 3, "name": "{{ARTICLE_TITLE}}", "item": "{{CANONICAL_URL}}" }
  ]
}
    </script>
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "@id": "{{CANONICAL_URL}}",
  "url": "{{CANONICAL_URL}}",
  "name": "{{SEO_TITLE}}",
  "description": "{{META_DESCRIPTION}}",
  "isPartOf": { "@type": "Organization", "name": "brightplace", "url": "https://www.brightplace.ai" },
  "speakable": { "@type": "SpeakableSpecification", "cssSelector": [".article-intro", "h1"] }
}
    </script>
    <!-- OPTIONAL: add a FAQPage block when the article has a Q&A section.
         Only include it when the questions and answers are actually visible
         on the page - Google requires the markup to match the rendered content. -->

    <style>
        *,*::before,*::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.75;
            color: #1a1a1a;
            max-width: 780px;
            margin: 0 auto;
            padding: 48px 24px;
            background: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        article { position: relative; }

        /* Article meta bar */
        .article-meta {
            color: #6b7280;
            font-size: 0.875rem;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }

        /* Headings */
        h1 {
            font-size: 2.1rem;
            line-height: 1.2;
            margin-bottom: 24px;
            color: #0f172a;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        h2 {
            font-size: 1.5rem;
            line-height: 1.3;
            margin-top: 48px;
            margin-bottom: 16px;
            color: #0f172a;
            font-weight: 600;
        }
        h3 {
            font-size: 1.2rem;
            line-height: 1.4;
            margin-top: 32px;
            margin-bottom: 12px;
            color: #1e293b;
            font-weight: 600;
        }

        /* Body text */
        p {
            margin-bottom: 18px;
            font-size: 1.05rem;
            color: #374151;
        }

        /* Article intro — AEO citability target */
        .article-intro {
            font-size: 1.125rem;
            line-height: 1.8;
            color: #1a1a1a;
            margin-bottom: 24px;
        }

        /* Links */
        a {
            color: #2563eb;
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 2px;
            transition: color 0.15s ease;
        }
        a:hover {
            color: #1d4ed8;
        }

        /* Horizontal rules */
        hr {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 40px 0;
        }

        strong { font-weight: 600; color: #1e293b; }

        /* FAQ section */
        .faq-section {
            margin-top: 48px;
            padding-top: 32px;
            border-top: 2px solid #e5e7eb;
        }
        .faq-section h3 {
            color: #0f172a;
            margin-top: 28px;
        }
        .faq-section p {
            color: #4b5563;
        }

        /* Article footer */
        .article-footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
            color: #9ca3af;
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 640px) {
            body { padding: 24px 16px; }
            h1 { font-size: 1.75rem; }
            h2 { font-size: 1.3rem; margin-top: 36px; }
            h3 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <article itemscope itemtype="https://schema.org/Article">
        <header>
            <div class="article-meta">
                <span>By <span itemprop="author">{{AUTHOR_NAME}}</span></span>
                &middot;
                <time datetime="{{DATE_PUBLISHED}}" itemprop="datePublished">{{DATE_PUBLISHED_READABLE}}</time>
            </div>
            <h1 itemprop="headline">{{ARTICLE_TITLE}}</h1>
        </header>

        <div itemprop="articleBody">
            <!-- ================================================================
                 {{BODY_HTML}}
                 The published body from the CMS.

                 IMPORTANT: Webflow rich-text embeds carry full mini-documents.
                 Strip document-level tags (html, head, body, title, meta, link)
                 before inserting, but KEEP everything else including <style>.
                 Leaving them in produces invalid markup and leaks CSS across
                 the page.
                 ================================================================ -->
        </div>

        <footer class="article-footer">
            <p>Last reviewed: {{DATE_MODIFIED_READABLE}}</p>
            <meta itemprop="dateModified" content="{{DATE_MODIFIED}}">
        </footer>
    </article>
</body>
</html>
